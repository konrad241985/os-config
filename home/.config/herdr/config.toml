onboarding = false
[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = ["prefix+c", "cmd+alt+t"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
previous_workspace = "alt+up"
next_workspace = "alt+down"
close_tab = ["prefix+ampersand", "cmd+alt+w"]
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
mouse_capture = true
pane_scrollbars = true
# Option-right-click passes through to Neovim instead of Herdr's pane menu.
right_click_passthrough_modifier = "alt"
# Keep dragged text highlighted; copy explicitly instead of clearing on release.
copy_on_select = false
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[theme]
name = "gruvbox"
auto_switch = false
